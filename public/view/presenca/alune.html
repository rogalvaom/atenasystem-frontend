<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AtenaSystem - Presença de Alunes</title>
	<link rel="stylesheet" href="/public/css/styles.css">
	<link rel="stylesheet" href="/public/view/presenca/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="/public/img/atena.png">
</head>
<body>
	<script>
		window.ATENA_PAGE_CONFIG = { title: 'Presença de Alunes', css: '', content: '', js: '/public/view/presenca/alune.js' };
	</script>
	<nav class="atn-navbar" id="atn-navbar" data-shared-navbar></nav>
	<div class="atn-layout attendance-layout">
		<aside class="atn-sidebar">
			<nav class="atn-sidebar-nav" id="atn-sidebar-nav"></nav>
		</aside>
		<main class="atn-main">
			<div class="attendance-page">
			<header class="attendance-header">
				<div>
					<p class="attendance-eyebrow"><i class="fas fa-clipboard-check" aria-hidden="true"></i> Controle de presença</p>
					<h2 class="attendance-heading">Presença de Alunes</h2>
				</div>
				<nav class="attendance-tabs" aria-label="Tipo de presença">
					<a href="/presenca/alune" class="atn-btn atn-btn-primary" aria-current="page">Alunes</a>
					<a href="/presenca/monitore" class="atn-btn atn-btn-secondary">Monitores</a>
					<a href="/presenca/reuniao" class="atn-btn atn-btn-secondary">Reunião</a>
					<a href="/presenca/tutore" class="atn-btn atn-btn-secondary">Tutores</a>
				</nav>
			</header>
			<div class="atn-card attendance-form">
				<h4 id="messageStatus" class="attendance-alert" role="status" style="display:none;"></h4>
				<form id="formBuscarSala">
					<section class="attendance-form-section">
						<div class="attendance-section-heading">
							<span class="attendance-step">01</span>
							<h3>Sala da chamada</h3>
						</div>
						<div class="attendance-field attendance-field--wide">
							<label for="selectSala">Sala</label>
							<select name="sala" id="selectSala" class="atn-input" required>
								<option value="">Carregando salas...</option>
							</select>
						</div>
						<div class="attendance-actions" style="padding:1rem 0 0;">
							<button type="submit" class="atn-btn atn-btn-primary"><i class="fas fa-magnifying-glass" aria-hidden="true"></i> Carregar Alunes</button>
						</div>
					</section>
				</form>

				<div id="formPresencaContainer" style="display:none;">
					<form id="formCriarPresenca">
						<input type="hidden" name="sala" id="inputSalaId">
						<section class="attendance-form-section">
							<div class="attendance-section-heading">
								<span class="attendance-step">02</span>
								<h3>Data e aula</h3>
							</div>
							<div class="attendance-fields">
								<div class="attendance-field">
									<label for="inputData">Data</label>
									<input name="data" id="inputData" class="atn-input" type="date" required>
								</div>
								<div class="attendance-field">
									<label for="selectAula">Aula</label>
									<select name="aula" id="selectAula" class="atn-input">
										<option value="1">Primeira Aula</option>
										<option value="2">Segunda Aula</option>
									</select>
								</div>
							</div>
						</section>
						<section class="attendance-form-section">
							<div class="attendance-section-heading">
								<span class="attendance-step">03</span>
								<h3>Marcação de presença</h3>
							</div>
							<div class="attendance-table-wrap">
								<table id="tableAlunes" class="attendance-table">
									<thead><tr><th>Nome</th><th style="text-align:center; width:120px;">Presente</th></tr></thead>
									<tbody></tbody>
								</table>
							</div>
							<div class="attendance-actions" style="padding:1.25rem 0 0;">
								<button type="submit" class="atn-btn atn-btn-primary"><i class="fas fa-check" aria-hidden="true"></i> Salvar Presença</button>
							</div>
						</section>
					</form>
				</div>
			</div>
			</div>
		</main>
	</div>
	<script type="module" src="/public/js/menu.js"></script>
</body>
</html>
