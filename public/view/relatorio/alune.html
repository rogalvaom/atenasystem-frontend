<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AtenaSystem - Relatório de Alunes</title>
	<link rel="stylesheet" href="/public/css/styles.css">
	<link rel="stylesheet" href="/public/view/relatorio/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="/public/img/atena.png">
</head>
<body>
	<script>window.ATENA_PAGE_CONFIG = { title: 'Relatório de Alunes', css: '', content: '', js: '/public/view/relatorio/alune.js' };</script>
	<nav class="atn-navbar" id="atn-navbar" data-shared-navbar></nav>
	<div class="atn-layout report-layout">
		<aside class="atn-sidebar"><nav class="atn-sidebar-nav" id="atn-sidebar-nav"></nav></aside>
		<main class="atn-main">
			<div class="report-page">
				<header class="report-header">
					<div>
						<p class="report-eyebrow"><i class="fas fa-chart-column" aria-hidden="true"></i> Indicadores de frequência</p>
						<h2 class="report-heading">Relatório de Alunes</h2>
					</div>
					<nav class="report-tabs" aria-label="Tipo de relatório">
						<a href="/relatorio/alune" class="atn-btn atn-btn-primary" aria-current="page">Alunes</a>
						<a href="/relatorio/monitore" class="atn-btn atn-btn-secondary">Monitores</a>
						<a href="/relatorio/reuniao" class="atn-btn atn-btn-secondary">Reunião</a>
						<a href="/relatorio/tutore" class="atn-btn atn-btn-secondary">Tutores</a>
					</nav>
				</header>
				<form id="formRelatorioAlune" class="atn-card report-filter">
					<section class="report-filter-section">
						<div class="report-section-heading"><span class="report-step">01</span><h3>Turma e período</h3></div>
						<div class="report-fields">
							<div class="report-field report-field--wide">
								<label for="selectCodSala">Sala</label>
								<select name="cod_sala" id="selectCodSala" class="atn-input" required><option value="">Carregando salas...</option></select>
							</div>
							<div class="report-field">
								<label for="inputDataInicial">Data Inicial</label>
								<input name="data_inicial" id="inputDataInicial" class="atn-input" type="date" required>
							</div>
							<div class="report-field">
								<label for="inputDataFinal">Data Final</label>
								<input name="data_final" id="inputDataFinal" class="atn-input" type="date" required>
							</div>
						</div>
					</section>
					<div class="report-actions"><button type="submit" class="atn-btn atn-btn-primary"><i class="fas fa-chart-line" aria-hidden="true"></i> Gerar Relatório</button></div>
				</form>
				<div id="relatorioTableContainer" class="report-results" style="display:none;">
					<header class="report-results-header"><h3>Frequência por alune</h3></header>
					<div class="report-table-wrap">
						<table class="report-table" id="tableRelatorioAlune">
							<thead><tr><th>Nome</th><th>Presença</th><th>Ausência</th><th>Justificado</th><th>Frequência</th></tr></thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
	<script type="module" src="/public/js/menu.js"></script>
</body>
</html>
